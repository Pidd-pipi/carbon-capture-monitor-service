<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carbon Capture Monitor</title><style>body{font:16px system-ui;max-width:960px;margin:32px auto;padding:0 16px;color:#203b35}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border-bottom:1px solid #cbd8d3;padding:10px;text-align:left}button,select,input{padding:8px}.ok{color:#147a52}.bad{color:#b02a2a}section{margin-top:28px}h2{font-size:18px}</style></head>
<body><h1>碳捕集设备监测</h1><p id="health">正在连接服务...</p>
<form id="status-form"><label>设备 <select id="unit"></select></label> <label>状态 <select id="status"><option>online</option><option>attention</option><option>offline</option><option>maintenance</option></select></label> <button>更新状态</button></form>
<p id="message"></p>
<table><thead><tr><th>设备</th><th>设施</th><th>捕集率</th><th>压力</th><th>溶剂余量</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table>
<section><h2>预警工单</h2><button id="refresh-alerts">刷新预警</button><table><thead><tr><th>编号</th><th>主题</th><th>优先级</th><th>状态</th><th>负责人</th><th>更新时间</th></tr></thead><tbody id="alert-rows"></tbody></table></section>
<section><h2>最新读数汇总</h2><button id="refresh-readings">刷新读数</button><table><thead><tr><th>设备</th><th>样本数</th><th>平均捕集率</th><th>平均压力</th><th>平均溶剂</th></tr></thead><tbody id="reading-rows"></tbody></table></section>
<script src="/app.js"></script></body></html>
